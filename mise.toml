[tools]
"cargo:cargo-bolero" = "latest"
"cargo:cargo-readme" = "latest"
"cargo:cargo-mutants" = "27.1.0"

[tasks.fmt]
run = "cargo +nightly fmt"
description = "Format code with nightly rustfmt"

[tasks.readme]
run = "cargo readme -o README.md"
description = "Generate README.md from crate-level documentation"

[tasks.bench]
run = "cargo bench --bench route_guard"
description = "Benchmark request resolution and route-table construction"

[tasks.test]
run = ["cargo test --locked --all-targets", "cargo test --locked --doc"]
description = "Run ordinary tests, benchmark smoke checks, and documentation tests (no Docker)"

[tasks.test-apache]
run = "bash scripts/test-downstream.sh apache"
description = "Differential baseline against Linux Apache in Docker (macOS/Linux)"

[tasks.test-downstream]
run = "bash scripts/test-downstream.sh"
description = "Differential baselines in Docker; optionally pass apache, express, axum, sveltekit, or nginx-apache"

[tasks.test-express]
run = "bash scripts/test-downstream.sh express"
description = "Differential baseline against Express in Docker"

[tasks.test-axum]
run = "bash scripts/test-downstream.sh axum"
description = "Differential baseline against Axum in Docker"

[tasks.test-sveltekit]
run = "bash scripts/test-downstream.sh sveltekit"
description = "Differential baseline against SvelteKit adapter-node in Docker"

[tasks.test-nginx-apache]
run = "bash scripts/test-downstream.sh nginx-apache"
description = "Two-decode NGINX normalized-URI proxy to Apache baseline"

# Coverage-guided fuzzing of a bolero target (needs nightly for libFuzzer). Primes the live
# corpus from the committed seeds in `fuzz-corpus/` so a run starts warm, then fuzzes.
# Targets are addressed by their fully-qualified name (see `cargo bolero list`); extra args
# pass through (e.g. `-T 60s` to bound a run, `-r <n>` for a run count).
#
#   mise run fuzz path_confusion_proptest::guard_relocation -T 600s   # router + verdict
#   mise run fuzz route_tree::tests::matcher_differential -T 300s     # matcher vs matchit
#   mise run fuzz structural::tests::scanner -T 300s                  # scanner invariants
#
# Edit/regenerate the seeds with:
#   cargo test regenerate_fuzz_corpus -- --ignored
[tasks.fuzz]
description = "Prime seeds and fuzz a bolero target by full name (nightly)"
run = "bash scripts/fuzz.sh"

[tasks.mutation]
run = "bash scripts/mutation-test.sh full"
description = "Audit guard and scanner mutations; preserve outcomes under target/mutation-audit"

[tasks.mutation-property]
run = "bash scripts/mutation-test.sh property"
description = "Verify the soundness property detects four fail-open guard mutations"
