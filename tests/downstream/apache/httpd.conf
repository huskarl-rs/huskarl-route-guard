ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn
PidFile /tmp/httpd.pid

# Each profile runs the same fixture with one explicit parsing choice changed.
AllowEncodedSlashes ${APACHE_ENCODED_SLASHES}
MergeSlashes On
DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Require all granted
    AllowOverride None
    Options None
    AcceptPathInfo Off
</Directory>

# The test client requests HTTP/1.0 and reads until close; no URL-aware client
# library gets a chance to normalize the request target or follow redirects.
KeepAlive Off

# Handler/resource identity survives HEAD's body suppression. These headers do
# not rewrite paths or choose routes; Apache's filesystem mapping selects scope.
<Directory "/usr/local/apache2/htdocs">
    Header set X-Route-ID public
</Directory>
<Directory "/usr/local/apache2/htdocs/admin">
    Header set X-Route-ID admin
</Directory>
<Directory "/usr/local/apache2/htdocs/files">
    Header set X-Route-ID files
</Directory>
<Directory "/usr/local/apache2/htdocs/files/private">
    Header set X-Route-ID private
</Directory>
