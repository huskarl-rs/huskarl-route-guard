name: fuzz

# Regression, coverage-guided discovery, and scheduled mutation audits:
#   - `regression` (push / PR): runs unit/CVE regressions, proptest properties, and
#     the three bolero harnesses with generated inputs and any available live corpus.
#     This job does not copy fuzz-corpus seeds; promote discovered bugs to explicit
#     regression tests so fresh checkouts exercise them.
#   - `discovery` (nightly / manual): the actual coverage-guided fuzzing. A fresh crash is
#     captured as an artifact (the gitignored corpus is ephemeral on the runner); the
#     corpus is cached so runs compound instead of starting cold each night.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 04:17 UTC daily — off-peak and off the top of the hour (the GitHub scheduler is
    # congested then). Daily cadence keeps the corpus cache inside its 7-day idle eviction.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Per-target fuzz duration in seconds (overrides the per-target default)"
        required: false
        default: ""

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  # Never cancel an in-flight fuzz campaign; let pushes coalesce the regression job.
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: regression (replay)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      # Runs Bolero under cargo test, proptest properties, and unit/CVE regressions.
      # Seed priming is performed separately by scripts/fuzz.sh in discovery.
      - run: mise run test

  discovery:
    name: discovery (${{ matrix.id }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Build (fuzz profile + sanitizer) plus the longest -T, with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false # one target's crash must not cancel the others
      matrix:
        include:
          # `time` is per-target: the guard target is ~5x slower per exec (it builds a
          # router and runs the full modeled-backend set per input), so it gets longer.
          - { id: scanner, target: "structural::tests::scanner", time: 300 }
          - { id: matcher, target: "route_tree::tests::matcher_differential", time: 300 }
          - { id: guard, target: "path_confusion_proptest::guard_relocation", time: 600 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # libFuzzer + AddressSanitizer require a nightly toolchain.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - name: Install cargo-bolero
        run: cargo install cargo-bolero --locked
      - name: Restore corpus
        # Run-id key (cache entries are immutable) + prefix restore-keys to pull the most
        # recent. Saved post-job even on failure, so a crash run still grows the corpus.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src/__fuzz__
          key: fuzz-corpus-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.id }}-
      - name: Fuzz ${{ matrix.target }}
        # scripts/fuzz.sh primes the live corpus from the committed seeds (so the run starts
        # warm even when the cache is cold) on top of whatever the cache restored, then runs.
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_DURATION: ${{ github.event.inputs.duration || matrix.time }}
        run: mise run fuzz "$FUZZ_TARGET" -T "${FUZZ_DURATION}s"
      - name: Upload crash reproducer
        # Only on failure — i.e. the fuzzer found a crash. The corpus is gitignored and
        # dies with the runner, so this is the only way to get the reproducing input.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.id }}
          path: src/__fuzz__/**/crashes/**
          if-no-files-found: warn
          retention-days: 90

  mutation-full:
    name: mutation (full audit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Changes each scheduled run; reruns keep the same seed for reproduction.
      PROPTEST_RNG_SEED: ${{ github.run_id }}
      PROPTEST_CASES: "2048"
      MUTATION_OUTPUT: target/mutation-audit/full-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - name: Install pinned cargo-mutants
        run: mise install cargo:cargo-mutants
      - name: Audit guard and scanner mutations
        # Known survivors and detected hangs make cargo-mutants exit nonzero.
        # Validate completion and reviewed outcomes below. Keep every mutant running.
        continue-on-error: true
        run: mise run mutation
      - name: Reject unexplained mutation outcomes and summarize the audit
        run: python3 scripts/check-mutation-outcomes.py full "$MUTATION_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Save mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-full-${{ github.run_id }}
          path: ${{ env.MUTATION_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 30
