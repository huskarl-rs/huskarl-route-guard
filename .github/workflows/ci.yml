name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Jobs install their required Cargo tools explicitly.
  MISE_AUTO_INSTALL: "false"

jobs:
  mutation-property:
    name: mutation (soundness control)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROPTEST_RNG_SEED: "20260923"
      PROPTEST_CASES: "2048"
      MUTATION_OUTPUT: target/mutation-audit/property-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - name: Install pinned cargo-mutants
        run: mise install cargo:cargo-mutants
      - name: Verify four fail-open controls against the soundness property
        run: mise run mutation-property
      - name: Save mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-property
          path: ${{ env.MUTATION_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 30

  downstream:
    name: Downstream (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [apache, express, axum, sveltekit, nginx-apache]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - name: Run downstream parsing profiles
        env:
          DOWNSTREAM_BACKEND: ${{ matrix.backend }}
        run: mise run test-downstream "$DOWNSTREAM_BACKEND"
      - name: Save downstream observations and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downstream-${{ matrix.backend }}
          path: target/downstream/
          if-no-files-found: ignore

  quality:
    name: quality (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # The project deliberately uses unstable rustfmt options; keep compilation on
      # stable while formatting with the same nightly toolchain as `mise run fmt`.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Run tests and documentation tests
        env:
          RUSTUP_TOOLCHAIN: stable
        run: mise run test

      - name: Test mutation outcome gate
        run: python3 -B scripts/test-mutation-outcomes.py

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: msrv

      - name: Check all targets on the minimum supported Rust version
        run: cargo check --locked --all-targets
