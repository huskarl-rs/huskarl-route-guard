name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Rust comes from the dtolnay/rust-toolchain actions; optional Cargo tools are not needed.
  MISE_AUTO_INSTALL: "false"

jobs:
  downstream:
    name: Downstream (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [apache, express, axum, sveltekit, nginx-apache]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Run downstream parsing profiles
        env:
          DOWNSTREAM_BACKEND: ${{ matrix.backend }}
        run: mise run test-downstream "$DOWNSTREAM_BACKEND"
      - name: Save downstream observations and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-${{ matrix.backend }}
          path: target/downstream/
          if-no-files-found: ignore

  quality:
    name: quality (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The project deliberately uses unstable rustfmt options; keep compilation on
      # stable while formatting with the same nightly toolchain as `mise run fmt`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Run tests and documentation tests
        env:
          RUSTUP_TOOLCHAIN: stable
        run: mise run test

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check all targets on the minimum supported Rust version
        run: cargo check --locked --all-targets
